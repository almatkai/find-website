[package]
name = "find-website-v2"
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[dependencies]
tezbar-extension-sdk = { git = "https://github.com/almatkai/tezbar-extension-sdk-rust.git", rev = "e955911f0bf5b558f9d3eb5183df0adc95c22af2", version = "=0.1.1" }
serde_json = "=1.0.145"
ryu-js = "=1.0.2"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
rusqlite = { version = "=0.32.1", features = ["bundled", "hooks", "limits"] }
tempfile = "=3.23.0"
uuid = { version = "=1.23.3", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.177"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[profile.release]
strip = "none"
lto = "thin"
codegen-units = 1
